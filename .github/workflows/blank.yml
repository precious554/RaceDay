name: RaceDay Documentation Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  check-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required documentation files
        run: |
          test -d docs
          test -f docs/RaceDay-ERD.png
          test -f docs/RaceDay_API Endpoint Plan.pdf
          test -f docs/RaceDay-Database.sql
          echo "All required RaceDay documentation files are present."
